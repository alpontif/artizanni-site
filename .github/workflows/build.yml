name: Build site

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**"]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build site into docs/
        run: python3 build.py
      - name: Commit changes
        id: commit
        run: |
          git config user.name "artizanni-bot"
          git config user.email "aec@artizanni.com"
          git add -A docs
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Build site"
          git push
          echo "changed=yes" >> "$GITHUB_OUTPUT"
      - name: Tell search engines (IndexNow) after GitHub Pages publishes
        if: steps.commit.outputs.changed == 'yes' || github.event_name == 'workflow_dispatch'
        run: sleep 120 && python3 tools/indexnow.py
